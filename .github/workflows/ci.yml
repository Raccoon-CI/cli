# Fails until lib v0.1.0 and raccoonci-runner v0.1.0 are tagged (go.mod requires them).
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet and race tests
        run: make check
      - name: Build
        run: make build
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/
